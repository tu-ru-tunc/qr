<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR-код для игры</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #f5efe6;
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #ffffff;
            border-radius: 2rem;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.12);
            padding: 2rem;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        .container h1 {
            font-size: 1.6rem;
            color: #3d2e1e;
            margin-bottom: 0.5rem;
        }
        .container .sub {
            color: #8a7a6a;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }
        .qr-wrapper {
            background: #ffffff;
            padding: 20px;
            border-radius: 1.5rem;
            border: 2px solid #e8ddd0;
            display: inline-block;
            margin-bottom: 1.5rem;
        }
        .qr-wrapper img {
            display: block;
            width: 200px;
            height: 200px;
        }
        .link-box {
            background: #f5efe8;
            border-radius: 1rem;
            padding: 12px 16px;
            font-size: 0.8rem;
            color: #3d2e1e;
            word-break: break-all;
            border: 1px solid #e8ddd0;
            margin-bottom: 1rem;
            font-family: monospace;
        }
        .btn {
            background: #2c7a7a;
            color: #fff;
            border: none;
            padding: 10px 28px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.15s;
            text-decoration: none;
            display: inline-block;
        }
        .btn:hover {
            background: #1a5a5a;
            transform: scale(0.96);
        }
        .btn-secondary {
            background: #f5c842;
            color: #3d2e1e;
        }
        .btn-secondary:hover {
            background: #e6b832;
        }
        .footnote {
            font-size: 0.7rem;
            color: #8a7a6a;
            margin-top: 1.2rem;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📱 QR-код</h1>
    <div class="sub">Отсканируйте, чтобы открыть игру</div>

    <div class="qr-wrapper">
        <img id="qrImage" src="" alt="QR-код">
    </div>

    <div class="link-box" id="linkDisplay">Ссылка загружается...</div>

    <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
        <button class="btn" onclick="copyLink()">📋 Скопировать ссылку</button>
        <a class="btn btn-secondary" id="openLink" href="#" target="_blank">🚀 Открыть игру</a>
    </div>

    <div class="footnote">
        Если QR-код не отображается — нажмите «Скопировать ссылку» и вставьте её в генератор QR-кодов
    </div>
</div>

<script>
    // ===== ПОЛУЧАЕМ ССЫЛКУ НА ТЕКУЩУЮ СТРАНИЦУ =====
    var currentUrl = window.location.href;

    // Показываем ссылку
    document.getElementById('linkDisplay').textContent = currentUrl;

    // Устанавливаем ссылку на кнопку "Открыть игру"
    document.getElementById('openLink').href = currentUrl;

    // ===== ГЕНЕРИРУЕМ QR-КОД ЧЕРЕЗ API (бесплатно) =====
    // Используем публичное API qrserver.com
    var qrUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=' + encodeURIComponent(currentUrl);
    document.getElementById('qrImage').src = qrUrl;

    // ===== КОПИРОВАТЬ ССЫЛКУ =====
    function copyLink() {
        var link = document.getElementById('linkDisplay').textContent;
        navigator.clipboard.writeText(link).then(function() {
            alert('✅ Ссылка скопирована! Вставьте её в генератор QR-кодов или отправьте коллегам.');
        }).catch(function() {
            // Fallback
            var textarea = document.createElement('textarea');
            textarea.value = link;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            alert('✅ Ссылка скопирована!');
        });
    }

    // Подсказка, если страница открыта не через сервер
    if (currentUrl.startsWith('file://')) {
        document.getElementById('linkDisplay').textContent = '⚠️ Файл открыт локально. Загрузите его на хостинг (GitHub Pages, Netlify) или в Telegram, чтобы получить рабочий QR-код.';
        document.getElementById('linkDisplay').style.background = '#ffebee';
        document.getElementById('linkDisplay').style.color = '#c62828';
        document.getElementById('qrImage').src = '';
        document.getElementById('qrImage').alt = 'QR-код недоступен';
    }
</script>

</body>
</html>
